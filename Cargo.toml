[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/kvm",
    "crates/vmm",
    "crates/memory",
    "crates/devices",
    "crates/graphics",
    "crates/input",
    "crates/audio",
    "crates/network",
    "crates/storage",
    "crates/adb",
    "crates/ipc",
    "crates/config",
    "crates/logging",
    "crates/diagnostics",
    "apps/cli",
    "apps/daemon",
    "apps/gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
authors = ["LiteDroid Contributors"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
nix = { version = "0.29", features = ["process", "signal", "fs", "net", "socket", "ioctl", "mman"] }
kvm-ioctls = "0.18"
kvm-bindings = "0.9"
crossbeam-channel = "0.5"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"

# Internal crates
litedroid-core = { path = "crates/core" }
litedroid-kvm = { path = "crates/kvm" }
litedroid-vmm = { path = "crates/vmm" }
litedroid-memory = { path = "crates/memory" }
litedroid-devices = { path = "crates/devices" }
litedroid-graphics = { path = "crates/graphics" }
litedroid-input = { path = "crates/input" }
litedroid-audio = { path = "crates/audio" }
litedroid-network = { path = "crates/network" }
litedroid-storage = { path = "crates/storage" }
litedroid-adb = { path = "crates/adb" }
litedroid-ipc = { path = "crates/ipc" }
litedroid-config = { path = "crates/config" }
litedroid-logging = { path = "crates/logging" }
litedroid-diagnostics = { path = "crates/diagnostics" }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

[profile.dev]
opt-level = 0
